# Release pipeline: on a v* tag, build the Linux x86_64 binary, smoke-test it,
# upload it to this project's generic package registry and publish a GitLab release.
# Built on Debian bullseye (glibc 2.31) so it runs on Ubuntu 20.04+ and Debian 11+.
#
# Stable download links (always the newest release):
#   https://gitlab.com/<project>/-/releases/permalink/latest/downloads/<BIN>-linux-x86_64.tar.gz

variables:
  BIN: "orchestrator"
  EXTRA: ""          # extra files or folders to ship in the archive
  SMOKE: "./target/release/orchestrator --help"          # command run against the built binary as a test
  PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BIN}/${CI_COMMIT_TAG}"

stages: [test, build, release]

build-linux:
  stage: build
  image: rust:1-bullseye
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  cache:
    key: cargo-bullseye
    paths: [target/, .cargo-home/]
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/target"
  script:
    # web-api: the HTTP server (including the OpenAI-compatible /v1 endpoints)
    - cargo build --release --locked --features web-api,tantivy --bin "$BIN"
    - ./target/release/$BIN --version
    - sh -c "$SMOKE"
    # Serve for real and answer an OpenAI-style request before publishing.
    - ./target/release/$BIN --provider echo --port 18080 </dev/null >/tmp/orch.log 2>&1 & echo $! > /tmp/orch.pid
    - sleep 3
    - curl -sf http://127.0.0.1:18080/v1/models || { cat /tmp/orch.log; exit 1; }
    - 'curl -sf http://127.0.0.1:18080/v1/chat/completions -H "Content-Type: application/json" -d "{\"model\":\"echo\",\"messages\":[{\"role\":\"user\",\"content\":\"release smoke test\"}]}" | grep -q "release smoke test" || { cat /tmp/orch.log; exit 1; }'
    - kill "$(cat /tmp/orch.pid)" || true
    - name="$BIN-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu"
    - mkdir -p "dist/$name"
    - cp "target/release/$BIN" README.md LICENSE "dist/$name/"
    - for x in $EXTRA; do cp -r "${x%%=*}" "dist/$name/$(basename "${x#*=}")"; done
    - cd dist
    - tar czf "$name.tar.gz" "$name"
    - cp "$name.tar.gz" "$BIN-linux-x86_64.tar.gz"
    - rm -rf "$name"
    - sha256sum *.tar.gz > SHA256SUMS.txt
    - cat SHA256SUMS.txt
    - 'for f in *; do curl --fail -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$PKG/$f" >/dev/null; echo "uploaded $f"; done'
  artifacts:
    paths: [dist/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$BIN $CI_COMMIT_TAG"
    description: "Linux x86_64 build of $BIN $CI_COMMIT_TAG (glibc 2.31+: Ubuntu 20.04, Debian 11 and newer). Download, `tar xzf`, run. Checksums in SHA256SUMS.txt. Or build from source with `cargo install --locked`."
    assets:
      links:
        - name: "Linux x86_64 (tar.gz)"
          url: "${PKG}/${BIN}-linux-x86_64.tar.gz"
          link_type: package
          direct_asset_path: "/${BIN}-linux-x86_64.tar.gz"
        - name: "SHA256SUMS.txt"
          url: "${PKG}/SHA256SUMS.txt"
          link_type: other
          direct_asset_path: "/SHA256SUMS.txt"

test:
  stage: test
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", ".gitlab-ci.yml"]
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/target"
    # ~60 test binaries with every feature: without these the debug info
    # fills the runner's disk and the linker dies with SIGBUS.
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    CARGO_INCREMENTAL: "0"
  cache:
    key: cargo-test
    paths: [target/, .cargo-home/]
  script:
    # The lean default build, then every test target and example with the
    # features they need (rig needs Rust 1.95+, which rust:1 has).
    - cargo check --locked --lib
    - cargo test --locked --no-fail-fast --lib --tests --examples --features "full tui mcp self-improving distributed schema tower async-openai genai rig tantivy"
    - cargo test --locked --doc --features "full tower async-openai genai"
