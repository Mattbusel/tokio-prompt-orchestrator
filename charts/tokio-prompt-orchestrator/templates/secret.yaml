{{- if and .Values.secret.create (not .Values.existingSecret) (include "tpo.useSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tpo.fullname" . }}
  labels:
    {{- include "tpo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secret.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.apiKey }}
  ORCHESTRATOR_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
