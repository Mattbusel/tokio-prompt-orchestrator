[package]
name = "tokio-prompt-orchestrator"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
default-run = "orchestrator"
description = "Put a queue, deduplication and a circuit breaker in front of any LLM API, so repeated prompts cost one call and outages fail fast. Rust library, HTTP server and CLI."
documentation = "https://docs.rs/tokio-prompt-orchestrator"
homepage = "https://tokio-prompt-orchestrator.vercel.app/"
repository = "https://gitlab.com/mattbusel/tokio-prompt-orchestrator"
license = "MIT"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "proxy", "circuit-breaker"]
categories = ["asynchronous", "network-programming", "web-programming::http-server", "command-line-utilities"]
exclude = [".github", "scripts", "assets", "site", "docs", "benches", "releases", ".idea", ".githooks", ".cargo", ".bench_baseline.txt", "claude_desktop_config.json"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# `cargo binstall tokio-prompt-orchestrator` downloads the GitLab release
# asset instead of compiling. Asset names come from .gitlab-ci.yml. Targets
# without a prebuilt binary 404 on the default URL, and binstall then builds
# from source.
[package.metadata.binstall]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/orchestrator-{ target }.tar.gz"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/orchestrator-linux-x86_64.tar.gz"
bin-dir = "orchestrator-v{ version }-x86_64-unknown-linux-gnu/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/orchestrator-windows-x86_64.exe"
pkg-fmt = "bin"

[package.metadata.docs.rs]
features = ["full", "tui", "mcp", "self-improving", "distributed", "schema", "core-pinning", "tower", "async-openai", "genai", "rig", "tantivy"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-futures = "0.2"
# OpenTelemetry (feature `otel`). OTLP over HTTP only: init_tracing never used
# the gRPC exporter, so tonic and its stack are no longer compiled.
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
thiserror = "1.0"
async-trait = "0.1"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "fast-rng", "serde"] }
rand = "0.8"

# HTTP + JSON
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing for the replay binary (feature `cli`)
clap = { version = "4", features = ["derive", "env"], optional = true }

# Metrics
# prometheus 0.14 without its default `protobuf` feature: the text exposition
# format is all /metrics serves, and dropping protobuf removes the
# RUSTSEC-2024-0437 dependency (and the advisory ignore in deny.toml) entirely.
prometheus = { version = "0.14", default-features = false }

# Web (feature-gated)
axum = { version = "0.8", optional = true, features = ["ws", "macros"] }
tower = { version = "0.5", optional = true, default-features = false, features = ["util", "timeout"] }
tower-http = { version = "0.6", optional = true, features = ["trace", "cors"] }
tokio-stream = { version = "0.1", optional = true }
futures = "0.3"
bytes = "1"
subtle = "2"

# Enhanced features
async-nats = { version = "0.35", optional = true }
notify = { version = "6", optional = true }
schemars = { version = "0.8", optional = true }
redis = { version = "0.24", optional = true, features = ["tokio-comp", "connection-manager"] }
dashmap = "5.5"
governor = { version = "0.6", optional = true }
nonzero_ext = { version = "0.3", optional = true }

# Optional core affinity pinning
core_affinity = { version = "0.8", optional = true }

# Regex engine for RegexReplaceStage in pipeline.rs
regex = "1"

# Retry with backoff and jitter: enhanced::retry and the inference stage
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }

# Bounded, per-entry-TTL concurrent cache behind enhanced::Deduplicator
moka = { version = "0.12", features = ["sync"] }

# Exact OpenAI token counts (token_counter, OpenAI proxy usage and spend cap)
tiktoken-rs = { version = "0.12", optional = true }

# SHA-256 for prompt cache content-addressing
sha2 = "0.10"
hex = "0.4"

# Self-tuning dependencies
parking_lot = "0.12"

# Config / task file parsing
toml = "0.8"

# TUI dashboard
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }

# Interop with other Rust LLM crates (each its own feature, see [features]).
async-openai = { version = "0.42", default-features = false, features = ["rustls", "chat-completion", "embedding"], optional = true }
genai = { version = "0.6", default-features = false, features = ["rustls-tls"], optional = true }
tantivy = { version = "0.26", default-features = false, features = ["stopwords", "stemmer"], optional = true }
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
rig-core = { version = "0.43", default-features = false, features = ["reqwest", "rustls"], optional = true }

# MCP server
rmcp = { version = "0.16", optional = true, features = ["server", "macros", "transport-io"] }
async-stream = "0.3"

[features]
# No features are enabled by default. The library compiles and runs without
# any optional features, providing only the core pipeline and worker types.
default = []

# metrics-server: Prometheus-compatible /metrics HTTP scrape endpoint via axum.
# Use with a Prometheus or VictoriaMetrics scraper. Port configurable in ServerConfig.
metrics-server = ["axum", "tower", "tower-http"]

# web-api: Full HTTP server with REST endpoints, SSE streaming, and WebSocket.
# Required by: mcp, dashboard.
web-api = ["axum", "tower", "tower-http", "tokio-stream", "tiktoken"]

# cli: the `replay` binary (replays a recorded request log against a provider).
cli = ["clap"]

# hot-reload: config::watcher, which re-reads a pipeline TOML file when it
# changes on disk (via notify). HotConfig works without it.
hot-reload = ["notify"]

# Interop: run the pipeline on top of the Rust LLM client you already use.
# Each adds one worker type under `integrations`. See src/integrations/mod.rs.
async-openai = ["dep:async-openai"]
genai = ["dep:genai"]
# rig needs Rust 1.95 or newer (rig-core's minimum).
rig = ["dep:rig-core"]
tower = ["dep:tower"]
# fastembed: local embedding models (BGE, MiniLM, ...) via ONNX Runtime, for
# semantic dedup without an API. Downloads the model once on first use.
# Needs Rust 1.88 or newer (fastembed's minimum).
fastembed = ["dep:fastembed"]
# tantivy: TantivyRetriever, BM25 full-text search over a folder of Markdown
# and text files, for grounding prompts in your documents. Rust 1.90+.
tantivy = ["dep:tantivy"]

# otel: export tracing spans to any OpenTelemetry collector (Jaeger, Tempo,
# Honeycomb, Datadog Agent, ...) over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT
# is set. Provides OtelLayer and try_build_otel_layer; init_tracing uses it.
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

# tiktoken: exact token counts for OpenAI models (GPT-5, GPT-4.1, GPT-4o,
# GPT-4, GPT-3.5, o-series) via tiktoken-rs. Other models keep the estimate.
# Adds the BPE tables (several MB) to the binary. Enabled by web-api.
tiktoken = ["tiktoken-rs"]

# caching: Redis-backed TTL result cache for inference responses.
# Reduces LLM API cost for repeated identical prompts across process restarts.
caching = ["redis"]

# rate-limiting: Token-bucket rate limiter at the pipeline entry point.
# Configurable via RateLimitConfig in pipeline.toml.
rate-limiting = ["governor", "nonzero_ext"]

# full: Convenience flag for single-node full-featured deployments.
# Enables web API, Prometheus metrics, Redis cache, rate limiting and OTLP export.
full = ["web-api", "metrics-server", "caching", "rate-limiting", "otel", "cli", "hot-reload"]

# Self-improvement tiers. Each tier is additive: self-modify includes self-tune,
# evolution includes self-tune + intelligence.

# self-tune: Closed-loop parameter tuning.
# Enables: PID controllers, TelemetryBus, AnomalyDetector (Z-score + CUSUM),
# SnapshotStore, CostOptimizer. Required by all higher self-improvement tiers.
self-tune = []

# self-modify: Autonomous config generation and validation.
# Enables: MetaTaskGenerator, ValidationGate (cargo test + clippy sandbox),
# AgentMemory. Requires self-tune.
self-modify = ["self-tune"]

# intelligence: Learned routing and autoscaling.
# Enables: LearnedRouter (epsilon-greedy bandit), Autoscaler, FeedbackCollector,
# QualityEstimator, PromptOptimizer, SemanticDedup. Requires self-tune.
intelligence = ["self-tune"]

# evolution: Evolutionary parameter search and A/B experiments.
# Enables: A/B experiment runner, snapshot rollback, transfer learning.
# Requires self-tune + intelligence.
evolution = ["self-tune", "intelligence"]

# self-improving: Meta-feature that enables all self-improvement subsystems.
# Equivalent to self-tune + self-modify + intelligence + evolution.
# Used by the self-improve binary and the SelfImprovingLoop type.
self-improving = ["self-tune", "self-modify", "intelligence", "evolution"]

# tui: Ratatui terminal dashboard with live pipeline metrics.
# Shows stage queue depths, circuit breaker state, dedup savings, sparklines.
tui = ["ratatui", "crossterm"]

# mcp: Model Context Protocol server.
# Exposes infer, pipeline_status, batch_infer, and configure_pipeline tools
# callable from Claude Desktop and Claude Code. Requires web-api.
mcp = ["rmcp", "web-api"]

# dashboard: Web dashboard UI. Requires web-api.
dashboard = ["web-api"]

# distributed: Multi-node coordination.
# Enables: Redis cross-node deduplication, NATS pub/sub work queues,
# leader election with TTL renewal, session affinity routing.
distributed = ["redis", "async-nats"]

# schema: JSON Schema export for PipelineConfig.
# Used by the gen_schema binary to produce pipeline.schema.json for IDE validation.
schema = ["schemars"]

# core-pinning: Pin pipeline stage tasks to specific CPU cores.
core-pinning = ["core_affinity"]

# zipkin: Export request traces to a Zipkin v2 HTTP endpoint.
# Set ZIPKIN_ENDPOINT=http://localhost:9411 at runtime.
zipkin = []

# datadog: Export request traces to a DataDog Agent (v0.4 trace API).
# Set DD_AGENT_HOST and optionally DD_AGENT_PORT at runtime.
datadog = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1"

[[example]]
name = "config_hot_reload"
required-features = ["hot-reload"]

[[example]]
name = "rest_api"
required-features = ["web-api"]

[[example]]
name = "sse_stream"
required-features = ["web-api"]

[[example]]
name = "websocket_api"
required-features = ["web-api"]

[[example]]
name = "web_api_demo"
required-features = ["web-api"]

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
required-features = ["cli"]

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"
required-features = ["dashboard"]

[[bin]]
name = "self-improve"
path = "src/bin/self_improve.rs"
required-features = ["self-improving"]

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[[bin]]
name = "gen_schema"
path = "src/bin/gen_schema.rs"
required-features = ["schema"]

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false

[[bench]]
name = "workers"
path = "benches/workers.rs"
harness = false

[[bench]]
name = "enhanced"
path = "benches/enhanced.rs"
harness = false

