<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="Five bounded stages; dropped requests go to the dead-letter queue">
<rect width="1200" height="560" rx="14" fill="#f5f3ee"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#17191c"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d8452f"/></marker></defs>
<text x="40" y="44" font-size="15" font-weight="700" fill="#17191c">spawn_pipeline(worker)</text>
<text x="40" y="64" font-size="12" fill="#676b72">five Tokio tasks joined by bounded mpsc channels; a full channel sheds to the DLQ instead of growing</text>
<text x="40" y="182" font-size="12" fill="#17191c">PromptRequest</text>
<text x="40" y="198" font-size="11" fill="#676b72">input_tx</text>
<line x1="152" y1="185.0" x2="194" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="173.0" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">512</text>
<rect x="200" y="150" width="150" height="70" rx="9" fill="#fffdf8" stroke="#17191c" stroke-width="1.4"/>
<text x="214" y="178" font-size="11" fill="#676b72">stage 1</text>
<text x="214" y="198" font-size="15" font-weight="700" fill="#17191c">retrieve</text>
<text x="214" y="213" font-size="10.5" fill="#676b72">RAG context</text>
<line x1="356" y1="185.0" x2="380" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="368.0" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">512</text>
<rect x="386" y="150" width="150" height="70" rx="9" fill="#fffdf8" stroke="#17191c" stroke-width="1.4"/>
<text x="400" y="178" font-size="11" fill="#676b72">stage 2</text>
<text x="400" y="198" font-size="15" font-weight="700" fill="#17191c">assemble</text>
<text x="400" y="213" font-size="10.5" fill="#676b72">build prompt</text>
<line x1="542" y1="185.0" x2="566" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="554.0" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">512</text>
<rect x="572" y="150" width="150" height="70" rx="9" fill="#fffdf8" stroke="#0d8f78" stroke-width="2.2"/>
<text x="586" y="178" font-size="11" fill="#676b72">stage 3</text>
<text x="586" y="198" font-size="15" font-weight="700" fill="#17191c">inference</text>
<text x="586" y="213" font-size="10.5" fill="#676b72">breaker + timeout</text>
<line x1="728" y1="185.0" x2="752" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="740.0" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">1024</text>
<rect x="758" y="150" width="150" height="70" rx="9" fill="#fffdf8" stroke="#17191c" stroke-width="1.4"/>
<text x="772" y="178" font-size="11" fill="#676b72">stage 4</text>
<text x="772" y="198" font-size="15" font-weight="700" fill="#17191c">post-process</text>
<text x="772" y="213" font-size="10.5" fill="#676b72">filter, format</text>
<line x1="914" y1="185.0" x2="938" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="926.0" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">512</text>
<rect x="944" y="150" width="150" height="70" rx="9" fill="#fffdf8" stroke="#17191c" stroke-width="1.4"/>
<text x="958" y="178" font-size="11" fill="#676b72">stage 5</text>
<text x="958" y="198" font-size="15" font-weight="700" fill="#17191c">stream</text>
<text x="958" y="213" font-size="10.5" fill="#676b72">output sink</text>
<line x1="1100" y1="185.0" x2="1154" y2="185.0" stroke="#17191c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1127" y="176.0" font-size="11" text-anchor="middle" fill="#676b72">256</text>
<text x="1102" y="242" font-size="12" fill="#17191c">PostOutput</text>
<text x="1102" y="258" font-size="11" fill="#676b72">output_rx</text>
<text x="200" y="128" font-size="11" fill="#676b72">numbers are channel capacities (spawn_pipeline defaults)</text>
<rect x="492" y="246" width="310" height="150" rx="10" fill="#ebe7de"/>
<line x1="647.0" y1="220" x2="647.0" y2="246" stroke="#0d8f78" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="508" y="272" font-size="11.5" fill="#17191c">deadline check</text>
<text x="508" y="290" font-size="11.5" fill="#17191c">CircuitBreaker: opens after 5 failures,</text>
<text x="508" y="308" font-size="11.5" fill="#676b72">  probes again after 60 s</text>
<text x="508" y="326" font-size="11.5" fill="#17191c">timeout, then your ModelWorker</text>
<text x="508" y="356" font-size="10.5" fill="#c28a06">wrap the worker with building blocks:</text>
<text x="508" y="373" font-size="10.5" fill="#676b72">Deduplicator, RetryPolicy, CacheLayer,</text>
<text x="508" y="388" font-size="10.5" fill="#676b72">RateLimiterRegistry, LoadBalancedWorker</text>
<line x1="802" y1="322" x2="942" y2="322" stroke="#0d8f78" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<text x="954" y="272" font-size="12" font-weight="700" fill="#17191c">ModelWorker backends</text>
<text x="954" y="292" font-size="11.5" fill="#17191c">AnthropicWorker</text>
<text x="954" y="309" font-size="11.5" fill="#17191c">OpenAiWorker</text>
<text x="954" y="326" font-size="11.5" fill="#17191c">LlamaCppWorker</text>
<text x="954" y="343" font-size="11.5" fill="#17191c">VllmWorker</text>
<text x="954" y="360" font-size="11.5" fill="#17191c">EchoWorker (no key)</text>
<text x="954" y="377" font-size="11.5" fill="#676b72">or impl ModelWorker</text>
<rect x="200" y="470" width="894" height="52" rx="10" fill="none" stroke="#d8452f" stroke-width="1.6"/>
<text x="218" y="492" font-size="13" font-weight="700" fill="#d8452f">DeadLetterQueue</text>
<text x="218" y="510" font-size="11" fill="#676b72">ring buffer of 1000; handles.dlq.drain() to inspect or replay</text>
<line x1="275.0" y1="222" x2="275.0" y2="466" stroke="#d8452f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arb)"/>
<text x="281.0" y="458" font-size="10" fill="#d8452f">backpressure:rag</text>
<line x1="461.0" y1="222" x2="461.0" y2="466" stroke="#d8452f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arb)"/>
<text x="467.0" y="458" font-size="10" fill="#d8452f">backpressure:assemble</text>
<line x1="833.0" y1="222" x2="833.0" y2="466" stroke="#d8452f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arb)"/>
<text x="839.0" y="458" font-size="10" fill="#d8452f">backpressure:post</text>
<line x1="647.0" y1="396" x2="647.0" y2="466" stroke="#d8452f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arb)"/>
<text x="653.0" y="430" font-size="10" fill="#d8452f">breaker open, failure,</text>
<text x="653.0" y="444" font-size="10" fill="#d8452f">timeout, deadline,</text>
<text x="653.0" y="458" font-size="10" fill="#d8452f">backpressure</text>
</svg>