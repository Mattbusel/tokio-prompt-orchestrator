name: Deploy site

# Publishes the project site (site/) to the gh-pages branch, with the rustdoc
# API docs for main under /api/. keep_files leaves the benchmark history that
# the CI bench job pushes to /dev/bench/ in place.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # .cargo/config.toml sets a custom target-dir; build into ./target here.
  CARGO_TARGET_DIR: target

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/*.png assets/*.svg _site/assets/
          cp .github/social-preview.png _site/assets/
          cp -r target/doc _site/api
          touch _site/.nojekyll
          test -f _site/api/tokio_prompt_orchestrator/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true
