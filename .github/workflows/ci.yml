name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  msrv:
    # The rust-version declared in Cargo.toml. The library with default
    # features must build on it. Some optional features need newer Rust
    # (rig: 1.97.1, tantivy: 1.90), so this job checks the lib only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      - name: llm-resilience, every feature
        run: cargo check -p llm-resilience --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings
      - name: Clippy (llm-resilience)
        run: |
          cargo clippy -p llm-resilience --all-targets -- -D warnings
          cargo clippy -p llm-resilience --all-features --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation builds without warnings
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p llm-resilience --all-features

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "web-api"
          - "metrics-server"
          - "tui"
          - "mcp"
          - "caching"
          - "rate-limiting"
          - "full"
          - "self-improving"
          - "distributed"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check feature set "${{ matrix.features }}"
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check
          else
            cargo check --features "${{ matrix.features }}"
          fi

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - name: Per-module coverage report
        run: cargo llvm-cov report
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  test:
    # Integration tests and doctests (test-coverage above runs the unit tests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests
        run: cargo test --tests
      - name: rig integration tests (RigWorker, OrchestratedTransport)
        run: cargo test --features rig,rig-transport --test integrations_tests
      - name: Doctests
        run: cargo test --doc
      - name: llm-resilience (no features, then every feature)
        run: |
          cargo test -p llm-resilience
          cargo test -p llm-resilience --all-features
      - name: Examples build
        run: cargo build --examples
      - name: Run the no-key LLM pipeline example
        run: cargo run --example llm_pipeline

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        # No ignores: prometheus 0.14 without protobuf dropped RUSTSEC-2024-0437, and
        # async-nats 0.50 (rustls-webpki 0.103) dropped the RUSTSEC-2026-0049/0098/
        # 0099/0104/0382 advisories that came in with the optional `distributed` feature.
        run: cargo audit

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: a restored partial criterion/ directory makes
      # `--output-format bencher` fail looking for a baseline sample.json.
      - name: Run benchmarks
        run: |
          cargo bench --bench pipeline \
            -- --output-format bencher | tee bench_output.txt
      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Pipeline Benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          # Shared runners vary by 20-35% run to run (two reruns of the same
          # commit flagged different benchmarks), so an alert comments on the
          # commit instead of failing main.
          fail-on-alert: false
