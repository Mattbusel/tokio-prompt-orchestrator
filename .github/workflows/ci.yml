name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation builds without warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "web-api"
          - "metrics-server"
          - "tui"
          - "mcp"
          - "caching"
          - "rate-limiting"
          - "full"
          - "self-improving"
          - "distributed"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check feature set "${{ matrix.features }}"
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check
          else
            cargo check --features "${{ matrix.features }}"
          fi

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - name: Per-module coverage report
        run: cargo llvm-cov report
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  test:
    # Integration tests and doctests (test-coverage above runs the unit tests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests
        run: cargo test --tests
      - name: Doctests
        run: cargo test --doc
      - name: Examples build
        run: cargo build --examples
      - name: Run the no-key LLM pipeline example
        run: cargo run --example llm_pipeline

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        # Ignored advisories, each reviewed:
        # - RUSTSEC-2024-0437: prometheus 0.13 protobuf; /metrics is behind METRICS_API_KEY (see Cargo.toml).
        # - RUSTSEC-2026-0189: rmcp Streamable HTTP transport; this crate only enables transport-io (stdio).
        # - RUSTSEC-2026-0049/0098/0099/0104: rustls-webpki 0.102 via async-nats 0.35, only with the
        #   optional `distributed` feature. The fix needs async-nats >= 0.47, which needs Rust 1.88 (MSRV is 1.85).
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0437
          --ignore RUSTSEC-2026-0189
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: a restored partial criterion/ directory makes
      # `--output-format bencher` fail looking for a baseline sample.json.
      - name: Run benchmarks
        run: |
          cargo bench --bench pipeline \
            -- --output-format bencher | tee bench_output.txt
      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Pipeline Benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          # Shared runners vary by 20-35% run to run (two reruns of the same
          # commit flagged different benchmarks), so an alert comments on the
          # commit instead of failing main.
          fail-on-alert: false
