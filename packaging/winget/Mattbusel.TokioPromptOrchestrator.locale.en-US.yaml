ShortDescription: Put a queue, deduplication and a circuit breaker in front of LLM API calls.
Description: |-
  orchestrator runs a prompt pipeline with request deduplication, a circuit breaker and a dead-letter queue in front of Anthropic, OpenAI, llama.cpp or vLLM. It serves a terminal prompt and an HTTP API (REST, SSE, WebSocket) at the same time. Run "orchestrator --provider echo" to try it with no API key.
